<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Letter</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(
            circle at 20% 20%,
            #ffe5ed 0%,
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 75%,
            #fff0d9 0%,
            transparent 30%
        ),
        #fffafa;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Georgia, "Times New Roman", serif;
}


/* =========================
   FLOATING HEARTS
========================= */

.heart {
    position: absolute;

    color: rgba(235, 150, 170, 0.22);

    font-size: 30px;

    animation: float 5s ease-in-out infinite;

    pointer-events: none;
}

.h1 {
    left: 12%;
    top: 18%;
}

.h2 {
    right: 13%;
    top: 25%;
    animation-delay: 1s;
}

.h3 {
    left: 18%;
    bottom: 20%;
    animation-delay: 2s;
}

.h4 {
    right: 20%;
    bottom: 15%;
    animation-delay: 3s;
}

@keyframes float {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }

}


/* =========================
   SCENE
========================= */

.scene {

    position: relative;

    width: min(82vw, 420px);
    height: min(60vw, 300px);

    perspective: 1000px;

    cursor: pointer;
}


/* =========================
   LETTER
========================= */

.letter {

    position: absolute;

    left: 8%;
    width: 84%;

    height: 90%;

    bottom: 5%;

    background:
        linear-gradient(
            135deg,
            #fffdf8,
            #fff8f1
        );

    border-radius: 5px;

    padding: 28px 24px;

    color: #805b62;

    box-shadow:
        0 8px 25px
        rgba(120, 70, 80, 0.12);

    transform:
        translateY(35%)
        scale(0.92);

    opacity: 0;

    /*
       CLOSED:
       Letter stays behind the envelope.
    */

    z-index: 2;

    transition:
        transform 1s cubic-bezier(.2,.8,.2,1),
        opacity .6s ease;

    pointer-events: none;
}


/* =========================
   ENVELOPE BODY
========================= */

.envelope {

    position: absolute;

    width: 100%;
    height: 70%;

    left: 0;
    bottom: 0;

    background: #f7d8c8;

    border-radius: 8px;

    box-shadow:
        0 18px 40px
        rgba(150, 90, 100, 0.18);

    /*
       IMPORTANT:
       Don't create a stacking context here.
       This lets the letter rise ABOVE the
       envelope when opened.
    */

    z-index: 4;

    transition:
        transform .7s ease;
}


/* =========================
   FRONT POCKET
========================= */

.front {

    position: absolute;

    inset: 0;

    background: #f4cdbb;

    clip-path: polygon(
        0 0,
        50% 58%,
        100% 0,
        100% 100%,
        0 100%
    );

    border-radius: 8px;

    z-index: 5;

    transition:
        opacity .5s ease;
}


/* =========================
   TOP FLAP
========================= */

.flap {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 60%;

    background: #f8ded1;

    clip-path: polygon(
        0 0,
        100% 0,
        50% 100%
    );

    transform-origin: top center;

    transition:
        transform .9s
        cubic-bezier(.2,.8,.2,1);

    z-index: 7;
}


/* =========================
   HEART SEAL
========================= */

.seal {

    position: absolute;

    left: 50%;
    top: 57%;

    transform:
        translate(-50%, -50%);

    z-index: 8;

    width: 48px;
    height: 48px;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    font-size: 23px;

    background: #e99aaa;

    border-radius: 50%;

    box-shadow:
        0 5px 15px
        rgba(180, 80, 100, 0.25);

    transition:
        opacity .3s ease,
        transform .5s ease;
}


/* =========================
   OPEN STATE
========================= */

/*
   THIS is the important part.

   The letter rises ABOVE the envelope.
*/

.scene.open .letter {

    transform:
        translateY(-20%)
        scale(1);

    opacity: 1;

    z-index: 10;
}


/*
   Front pocket becomes transparent
   after the letter comes out.

   This prevents it from covering
   the message.
*/

.scene.open .front {

    opacity: 0;
}


/*
   Flap opens normally.
*/

.scene.open .flap {

    transform:
        rotateX(180deg);
}


/*
   Seal disappears.
*/

.scene.open .seal {

    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(.5);
}


/* =========================
   LETTER TEXT
========================= */

.letter h2 {

    margin: 0 0 18px;

    color: #d98296;

    font-size: 25px;

    text-align: center;

    font-weight: normal;
}

.letter p {

    font-size: 17px;

    line-height: 1.7;

    text-align: center;

    margin: 0;
}

.signature {

    margin-top: 25px;

    text-align: right;

    color: #d98296;

    font-style: italic;
}


/* =========================
   TAP HINT
========================= */

.hint {

    position: absolute;

    bottom: -45px;

    width: 100%;

    text-align: center;

    color: #bd8994;

    font-size: 14px;

    transition:
        opacity .4s ease;
}

.scene.open + .hint {
    opacity: 0;
}

/* =========================
   LETTER CREATOR
========================= */

.creator {
    position: relative;
    z-index: 20;

    width: min(90vw, 420px);
    margin: 0 auto 25px;

    padding: 22px;

    background: rgba(255, 250, 250, 0.95);

    border-radius: 18px;

    box-shadow:
        0 12px 35px
        rgba(150, 90, 100, 0.18);

    text-align: center;
}

.creator h1 {
    margin: 0 0 18px;

    color: #d98296;

    font-size: 22px;

    font-weight: normal;
}

.creator input,
.creator textarea {
    width: 100%;

    margin-bottom: 12px;

    padding: 12px;

    border: 1px solid #efd1d7;

    border-radius: 10px;

    background: #fffdfd;

    color: #805b62;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 15px;

    outline: none;
}

.creator textarea {
    height: 120px;

    resize: none;
}

.creator input:focus,
.creator textarea:focus {
    border-color: #e99aaa;
}

.creator button {
    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 12px;

    background: #e99aaa;

    color: white;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 16px;

    cursor: pointer;

    box-shadow:
        0 5px 15px
        rgba(180, 80, 100, 0.2);
}

.creator button:active {
    transform: scale(0.98);
}
</style>
</head>


<body>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>


<!-- Background hearts -->

<div class="heart h1">♡</div>
<div class="heart h2">♡</div>
<div class="heart h3">♡</div>
<div class="heart h4">♡</div>


<!-- =========================
     LETTER
========================= -->

<div>

    <div
        class="scene"
        id="scene"
    >

        <!-- The actual letter -->

        <div class="letter">

            <h2>Hi! 💗</h2>

            <p>
                Thanks for actually opening
                my test letter!
                <br><br>
                It's under construction!
            </p>

            <div class="signature">
                — Sy ♡
            </div>

        </div>


        <!-- Envelope -->

        <div class="envelope">

            <div class="flap"></div>

            <div class="front"></div>

            <div class="seal">
                ♥
            </div>

        </div>

    </div>


    <div class="hint">
        Tap the letter to open ♡
    </div>

</div>


<script>

const scene = document.getElementById("scene");
const music = document.getElementById("music");

const creator = document.getElementById("creator");
const createButton = document.getElementById("createButton");

const recipientInput = document.getElementById("recipient");
const titleInput = document.getElementById("title");
const messageInput = document.getElementById("message");
const senderInput = document.getElementById("sender");

const letterTitle = document.querySelector(".letter h2");
const letterMessage = document.querySelector(".letter p");
const letterSignature = document.querySelector(".signature");

let opened = false;


/* =========================
   CHECK FOR SHARED LETTER
========================= */

const params = new URLSearchParams(window.location.search);

const sharedRecipient = params.get("to");
const sharedTitle = params.get("title");
const sharedMessage = params.get("message");
const sharedSender = params.get("from");


if (sharedMessage) {

    letterTitle.textContent =
        sharedTitle || "Hi! 💗";

    letterMessage.textContent =
        sharedMessage;

    letterSignature.textContent =
        "— " + (sharedSender || "Someone") + " ♡";

    if (sharedRecipient) {
        letterTitle.textContent =
            "Hi, " + sharedRecipient + "! 💗";
    }

    /* Hide creator when viewing a shared letter */
    creator.style.display = "none";

}


/* =========================
   ENVELOPE + MUSIC
========================= */

scene.addEventListener("click", () => {

    opened = !opened;

    scene.classList.toggle("open", opened);

    if (opened) {

        music.volume = 0.35;

        music.play().catch(() => {});

    } else {

        music.pause();

        music.currentTime = 0;

    }

});


/* =========================
   CREATE SHAREABLE LETTER
========================= */

createButton.addEventListener("click", async () => {

    const recipient =
        recipientInput.value.trim();

    const title =
        titleInput.value.trim();

    const message =
        messageInput.value.trim();

    const sender =
        senderInput.value.trim();


    if (!recipient || !title || !message || !sender) {

        alert("Please fill in every box 💗");

        return;

    }


    const url =
        new URL(window.location.href);

    url.search = "";

    url.searchParams.set("to", recipient);
    url.searchParams.set("title", title);
    url.searchParams.set("message", message);
    url.searchParams.set("from", sender);


    const shareLink =
        url.toString();


    try {

        await navigator.clipboard.writeText(shareLink);

        alert(
            "💌 Your letter link has been copied!\n\nSend it to someone special ❤️"
        );

    } catch (error) {

        prompt(
            "Copy your letter link:",
            shareLink
        );

    }

});

</script>
