<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Letter</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(
            circle at 20% 20%,
            #ffe5ed 0%,
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 75%,
            #fff0d9 0%,
            transparent 30%
        ),
        #fffafa;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Georgia, "Times New Roman", serif;
}


/* =========================
   FLOATING HEARTS
========================= */

.heart {
    position: absolute;

    color: rgba(235, 150, 170, 0.22);

    font-size: 30px;

    animation: float 5s ease-in-out infinite;

    pointer-events: none;
}

.h1 {
    left: 12%;
    top: 18%;
}

.h2 {
    right: 13%;
    top: 25%;
    animation-delay: 1s;
}

.h3 {
    left: 18%;
    bottom: 20%;
    animation-delay: 2s;
}

.h4 {
    right: 20%;
    bottom: 15%;
    animation-delay: 3s;
}

@keyframes float {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }

}


/* =========================
   SCENE
========================= */

.scene {

    position: relative;

    width: min(82vw, 420px);
    height: min(60vw, 300px);

    perspective: 1000px;

    cursor: pointer;
}


/* =========================
   LETTER
========================= */

.letter {

    position: absolute;

    left: 8%;
    width: 84%;

    height: 90%;

    bottom: 5%;

    background:
        linear-gradient(
            135deg,
            #fffdf8,
            #fff8f1
        );

    border-radius: 5px;

    padding: 28px 24px;

    color: #805b62;

    box-shadow:
        0 8px 25px
        rgba(120, 70, 80, 0.12);

    transform:
        translateY(35%)
        scale(0.92);

    opacity: 0;

    /*
       CLOSED:
       Letter stays behind the envelope.
    */

    z-index: 2;

    transition:
        transform 1s cubic-bezier(.2,.8,.2,1),
        opacity .6s ease;

    pointer-events: none;
}


/* =========================
   ENVELOPE BODY
========================= */

.envelope {

    position: absolute;

    width: 100%;
    height: 70%;

    left: 0;
    bottom: 0;

    background: #f7d8c8;

    border-radius: 8px;

    box-shadow:
        0 18px 40px
        rgba(150, 90, 100, 0.18);

    /*
       IMPORTANT:
       Don't create a stacking context here.
       This lets the letter rise ABOVE the
       envelope when opened.
    */

    z-index: 4;

    transition:
        transform .7s ease;
}


/* =========================
   FRONT POCKET
========================= */

.front {

    position: absolute;

    inset: 0;

    background: #f4cdbb;

    clip-path: polygon(
        0 0,
        50% 58%,
        100% 0,
        100% 100%,
        0 100%
    );

    border-radius: 8px;

    z-index: 5;

    transition:
        opacity .5s ease;
}


/* =========================
   TOP FLAP
========================= */

.flap {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 60%;

    background: #f8ded1;

    clip-path: polygon(
        0 0,
        100% 0,
        50% 100%
    );

    transform-origin: top center;

    transition:
        transform .9s
        cubic-bezier(.2,.8,.2,1);

    z-index: 7;
}


/* =========================
   HEART SEAL
========================= */

.seal {

    position: absolute;

    left: 50%;
    top: 57%;

    transform:
        translate(-50%, -50%);

    z-index: 8;

    width: 48px;
    height: 48px;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    font-size: 23px;

    background: #e99aaa;

    border-radius: 50%;

    box-shadow:
        0 5px 15px
        rgba(180, 80, 100, 0.25);

    transition:
        opacity .3s ease,
        transform .5s ease;
}


/* =========================
   OPEN STATE
========================= */

/*
   THIS is the important part.

   The letter rises ABOVE the envelope.
*/

.scene.open .letter {

    transform:
        translateY(-20%)
        scale(1);

    opacity: 1;

    z-index: 10;
}


/*
   Front pocket becomes transparent
   after the letter comes out.

   This prevents it from covering
   the message.
*/

.scene.open .front {

    opacity: 0;
}


/*
   Flap opens normally.
*/

.scene.open .flap {

    transform:
        rotateX(180deg);
}


/*
   Seal disappears.
*/

.scene.open .seal {

    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(.5);
}


/* =========================
   LETTER TEXT
========================= */

.letter h2 {

    margin: 0 0 18px;

    color: #d98296;

    font-size: 25px;

    text-align: center;

    font-weight: normal;
}

.letter p {

    font-size: 17px;

    line-height: 1.7;

    text-align: center;

    margin: 0;
}

.signature {

    margin-top: 25px;

    text-align: right;

    color: #d98296;

    font-style: italic;
}


/* =========================
   TAP HINT
========================= */

.hint {

    position: absolute;

    bottom: -45px;

    width: 100%;

    text-align: center;

    color: #bd8994;

    font-size: 14px;

    transition:
        opacity .4s ease;
}

.scene.open + .hint {
    opacity: 0;
}

</style>
</head>


<body>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>


<!-- Background hearts -->

<div class="heart h1">♡</div>
<div class="heart h2">♡</div>
<div class="heart h3">♡</div>
<div class="heart h4">♡</div>


<!-- =========================
     LETTER
========================= -->

<div>

    <div
        class="scene"
        id="scene"
    >

        <!-- The actual letter -->

        <div class="letter">

            <h2>Hi! 💗</h2>

            <p>
                Thanks for actually opening
                my test letter!
                <br><br>
                It's under construction!
            </p>

            <div class="signature">
                — Sy ♡
            </div>

        </div>


        <!-- Envelope -->

        <div class="envelope">

            <div class="flap"></div>

            <div class="front"></div>

            <div class="seal">
                ♥
            </div>

        </div>

    </div>


    <div class="hint">
        Tap the letter to open ♡
    </div>

</div>


<script>

const scene = document.getElementById("scene");
const music = document.getElementById("music");

let opened = false;

scene.addEventListener("click", () => {

    opened = !opened;

    scene.classList.toggle("open", opened);

    if (opened) {
        music.volume = 0.35;
        music.play().catch(() => {});
    } else {
        music.pause();
        music.currentTime = 0;
    }

});

</script>
